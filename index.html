<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            background-color: #f0f0f8;
        }
        .Notification{
            margin: 0;
            padding: 0;
            width: 100%;
        }
        header {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 70px;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0 2rem;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .divider{
            display: none;
            margin: 0 4px;
        }
        .header-right{
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
        }
        .icon-btn{
            width: clamp(36px, 4vw, 44px);
            height: clamp(36px, 4vw, 44px);
            border-radius: 50%;
            background-color: #f4e3cf;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
        }
        .icon-btn img{
            width: 55%;
            height: 55%;
            object-fit: contain;
            background: transparent;
        }
        .search-bar{ display: none; }
        .search-mobile{ display: flex; }
        @media (min-width: 1024px) {
            .search-bar{ 
                display: flex;
                align-items: center;
                background-color: #f4e3cf;
                border: none;
                border-radius: 50px;
                padding: 0 14px;
                height: 40px;
                width: clamp(120px, 16.6vw, 280px);
                box-sizing: border-box;
            }
            .search-icon{
                width: 16px;
                height: 16px;
                flex-shrink: 0;
                background: transparent;
            }
            .search-bar input{
                flex: 1;
                background: transparent;
                border: none;
                outline: none;
                padding-left: 10px;
                color: #222;
                font-size: 14px;
            }
            .divider{ display: block; }
            .search-mobile{ display: none;}
        }
        .bottom-navbar{
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            min-height: 60px;
            height: clamp(60px, 8vh, 80px);
            background-color: #f7f7f7;
            z-index: 9999;
            box-sizing: border-box;
        }
        .nav-item{
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: rgb(34, 204, 99);
            height: 100%;
            background: transparent;
        }
        .nav-item img{
            width: clamp(20px, 5vw, 28px);
            height: clamp(20px, 5vw, 28px);
            filter: contrast(70%);
            opacity: 0.7;
            object-fit: contain;
            margin-top: 4px;
            background: transparent;
        }
        a[class^="nav-item home-btn"] span {
            font-family: Arial, sans-serif;
            font-weight: 600;
            font-size: clamp(10px, 2vw, 12px);
            margin-top: 2px;
            color: #0f044c;
            filter: none;
            opacity: none;
            background: none;
        }
        .nav-item span{
            font-family: Arial, sans-serif;
            font-weight: 600;
            font-size: clamp(10px, 2vw, 12px);
            margin-top: 2px;
            color: #000000;
            filter: contrast(70%);
            opacity: 0.7;
            background: none;
        }
        .search-btn span {
            color: #ffffff;
            background: transparent;
        }
        .search-btn-background{
            opacity: 0.8;
            background-color: #0f044c;
            border-radius: 50%;
            width: clamp(24px, 6vw, 34px);
            height: clamp(24px, 6vw, 34px);
            padding: 20px;
            margin-bottom: 26px;
        }
        .search-btn img{
            width: clamp(24px, 6vw, 34px);
            height: clamp(24px, 6vw, 34px);
            filter: invert(1); 
        }
        @media (min-width: 1024px) {
            .bottom-navbar { display: none; }
        }
    </style>
    <style id="categories-styles">
        #categories-section { padding: 28px 0 24px; background: var(--background); }
        .sec-eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
        .sec-title { font-size: 24px; font-weight: 800; color: var(--foreground); letter-spacing: -0.03em; line-height: 1.1; }
        .sec-title .thin { font-weight: 200; font-style: italic; }
        .sec-header { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 20px; margin-bottom: 16px; }
        .view-all-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--secondary-foreground); cursor: pointer; white-space: nowrap; padding: 6px 12px; border-radius: 100px; background: var(--secondary); }
        #cat-scroll { display: flex; gap: 10px; padding: 0 20px; overflow-x: auto; }
        #cat-scroll::-webkit-scrollbar { display: none; }
        .cat-card { border-radius: var(--radius-lg); overflow: hidden; position: relative; cursor: pointer; flex-shrink: 0; width: 140px; height: 190px; }
        .cat-card.wide { width: 200px; }
        .cat-card img { width: 100%; height: 100%; object-fit: cover; }
        .cat-ov { position: absolute; inset: 0; background: linear-gradient( to top, rgba(0, 0, 0, 0.75) 0%, transparent 55% ); }
        .cat-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 12px; }
        .cat-micro { font-size: 7px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
        .cat-name { font-size: 13px; font-weight: 700; color: #fff; }
        .cat-count { font-size: 9px; color: rgba(255, 255, 255, 0.5); margin-top: 1px; }
        .cat-arr { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; background: rgba(255, 255, 255, 0.14); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
      </style>
</head>
<body>
    <div class="Notification" style="display: none;">
        <img src="" alt="">
        <h6>This is Notification text</h6>
        <h6>X</h6>
    </div>
    <header>
        <a class="logo" href="/">
            <img src="logo.png" alt="Logo">
        </a>
        <div class="header-right">
            <form class="search-bar">
                <img src="stock/search_icon.png" alt="Searchbar" class="search-icon">
                <input type="search" placeholder="Search Products" id="">
            </form>
            <span class="divider">|</span>
            <a href="#" class="icon-btn search-mobile"><img src="stock/search_icon.png" alt="Search" draggable="false"></a>
            <a href="#"class="icon-btn wishlist"><img src="stock/heart.png" alt="Wishlist"></a>
            <a href="#"class="icon-btn profile"><img src="stock/user.png" alt="Profile"></a>
        </div>
    </header>
    <section id="categories-section">
        <div class="sec-header">
          <div>
            <div class="sec-eyebrow">Explore</div>
            <h2 class="sec-title">
              Premium <span class="thin">Categories</span>
            </h2>
          </div>
          <div class="view-all-btn" data-media-type="banani-button">
            All
            <iconify-icon
              icon="lucide:arrow-right"
              style="font-size: 10px; color: var(--secondary-foreground)"
            ></iconify-icon>
          </div>
        </div>
        <div id="cat-scroll">
          <div class="cat-card wide" data-media-type="banani-button">
            <img
              data-query="ultra luxury womenswear editorial flowing white silk dress warm golden cinematic light photorealistic premium portrait"
              data-aspect-ratio="2:3"
              alt="Womenswear"
              src="https://app.banani.co/image-fallback.png"
            />
            <div class="cat-ov"></div>
            <div class="cat-arr">
              <iconify-icon
                icon="lucide:arrow-up-right"
                style="font-size: 10px; color: #fff"
              ></iconify-icon>
            </div>
            <div class="cat-info">
              <div class="cat-micro">Most Popular</div>
              <div class="cat-name">Womenswear</div>
              <div class="cat-count">4,200+ pieces</div>
            </div>
          </div>
          <div class="cat-card" data-media-type="banani-button">
            <img
              data-query="luxury menswear editorial tailored dark suit elegant man studio professional warm light photorealistic"
              data-aspect-ratio="2:3"
              alt="Menswear"
              src="https://storage.googleapis.com/banani-generated-images/generated-images/0c5aa0d8-de5a-4880-99c5-0dee637f7594.jpg"
            />
            <div class="cat-ov"></div>
            <div class="cat-arr">
              <iconify-icon
                icon="lucide:arrow-up-right"
                style="font-size: 10px; color: #fff"
              ></iconify-icon>
            </div>
            <div class="cat-info">
              <div class="cat-micro">Classic</div>
              <div class="cat-name">Menswear</div>
              <div class="cat-count">2,100+</div>
            </div>
          </div>
          <div class="cat-card" data-media-type="banani-button">
            <img
              data-query="luxury designer handbag leather gold hardware white marble minimal editorial premium product"
              data-aspect-ratio="2:3"
              alt="Accessories"
              src="https://storage.googleapis.com/banani-generated-images/generated-images/4f2c279f-f9f0-4ab4-8862-a7785b89fc04.jpg"
            />
            <div class="cat-ov"></div>
            <div class="cat-arr">
              <iconify-icon
                icon="lucide:arrow-up-right"
                style="font-size: 10px; color: #fff"
              ></iconify-icon>
            </div>
            <div class="cat-info">
              <div class="cat-micro">Iconic</div>
              <div class="cat-name">Accessories</div>
              <div class="cat-count">1,800+</div>
            </div>
          </div>
          <div class="cat-card" data-media-type="banani-button">
            <img
              data-query="luxury premium leather heels pumps footwear product white background minimal editorial elegant"
              data-aspect-ratio="2:3"
              alt="Footwear"
              src="https://storage.googleapis.com/banani-generated-images/generated-images/52a40066-5ec6-4ef7-954e-bd6640c927fa.jpg"
            />
            <div class="cat-ov"></div>
            <div class="cat-arr">
              <iconify-icon
                icon="lucide:arrow-up-right"
                style="font-size: 10px; color: #fff"
              ></iconify-icon>
            </div>
            <div class="cat-info">
              <div class="cat-micro">Signature</div>
              <div class="cat-name">Footwear</div>
              <div class="cat-count">900+</div>
            </div>
          </div>
          <div class="cat-card" data-media-type="banani-button">
            <img
              data-query="luxury skincare beauty gold packaging premium white minimal editorial high end cosmetics"
              data-aspect-ratio="2:3"
              alt="Beauty"
              src="https://storage.googleapis.com/banani-generated-images/generated-images/ee2a9485-0f5e-4f9c-9617-a872d9534084.jpg"
            />
            <div class="cat-ov"></div>
            <div class="cat-arr">
              <iconify-icon
                icon="lucide:arrow-up-right"
                style="font-size: 10px; color: #fff"
              ></iconify-icon>
            </div>
            <div class="cat-info">
              <div class="cat-micro">Essentials</div>
              <div class="cat-name">Beauty</div>
              <div class="cat-count">620+</div>
            </div>
          </div>
        </div>
      </section>
    <nav class="bottom-navbar" aria-level="Main Navigation">
        <a href="/" class="nav-item home-btn"><img src="stock/home.png" alt="Home" style=" filter: brightness(0) saturate(100%) invert(10%) sepia(48%) saturate(2700%) hue-rotate(245deg) brightness(75%) contrast(115%);">
            <span>Home</span></a>
        <a href="/" class="nav-item wishlist-btn"><img src="stock/heart.png" alt="Wishlist">
            <span>Wishlist</span></a>
        <div class="search-btn-background">
        <a href="/" class="nav-item search-btn"><img src="stock/search_icon.png" alt="Search">
            <span>Search</span></a>
        </div>
        <a href="/" class="nav-item cart-btn"><img src="stock/shopping-bag.png" alt="Cart">
            <span>Cart</span></a>
        <a href="/" class="nav-item profile-btn"><img src="stock/user.png" alt="Profile">
            <span>Profile</span></a>
    </nav>
</body>
</html>
