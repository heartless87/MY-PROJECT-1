<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            background-color: #f0f0f8;
        }
        .Notification{
            margin: 0;
            padding: 0;
            width: 100%;
        }
        header {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 70px;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0 2rem;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .divider{
            display: none;
            margin: 0 4px;
        }
        .header-right{
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
        }
        .icon-btn{
            width: clamp(36px, 4vw, 44px);
            height: clamp(36px, 4vw, 44px);
            border-radius: 50%;
            background-color: #f4e3cf;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
        }
        .icon-btn img{
            width: 55%;
            height: 55%;
            object-fit: contain;
            background: transparent;
        }
        .search-bar{ display: none; }
        .search-mobile{ display: flex; }
        @media (min-width: 1024px) {
            .search-bar{ 
                display: flex;
                align-items: center;
                background-color: #f4e3cf;
                border: none;
                border-radius: 50px;
                padding: 0 14px;
                height: 40px;
                width: clamp(120px, 16.6vw, 280px);
                box-sizing: border-box;
            }
            .search-icon{
                width: 16px;
                height: 16px;
                flex-shrink: 0;
                background: transparent;
            }
            .search-bar input{
                flex: 1;
                background: transparent;
                border: none;
                outline: none;
                padding-left: 10px;
                color: #222;
                font-size: 14px;
            }
            .divider{ display: block; }
            .search-mobile{ display: none;}
        }
        .bottom-navbar{
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            min-height: 60px;
            height: clamp(60px, 8vh, 80px);
            background-color: #f7f7f7;
            z-index: 9999;
            box-sizing: border-box;
        }
        .nav-item{
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: rgb(34, 204, 99);
            height: 100%;
            background: transparent;
        }
        .nav-item img{
            width: clamp(20px, 5vw, 28px);
            height: clamp(20px, 5vw, 28px);
            filter: contrast(70%);
            opacity: 0.7;
            object-fit: contain;
            margin-top: 4px;
            background: transparent;
        }
        .nav-item span{
            font-size: clamp(10px, 2vw, 12px);
            margin-top: 2px;
            color: #0f044c;
        }
        .search-btn img{
            width: clamp(24px, 6vw, 34px);
            height: clamp(24px, 6vw, 34px);
        }
        @media (min-width: 1024px) {
            .bottom-navbar { display: none; }
        }
    </style>
</head>
<body>
    <div class="Notification" style="display: none;">
        <img src="" alt="">
        <h6>This is Notification text</h6>
        <h6>X</h6>
    </div>
    <header>
        <a class="logo" href="/">
            <img src="logo.png" alt="Logo">
        </a>
        <div class="header-right">
            <form class="search-bar">
                <img src="stock/search_icon.png" alt="Searchbar" class="search-icon">
                <input type="search" placeholder="Search Products" id="">
            </form>
            <span class="divider">|</span>
            <a href="#" class="icon-btn search-mobile"><img src="stock/search_icon.png" alt="Search"></a>
            <a href="#"class="icon-btn wishlist"><img src="stock/heart.png" alt="Wishlist"></a>
            <a href="#"class="icon-btn profile"><img src="stock/user.png" alt="Profile"></a>
        </div>
    </header>
    <nav class="bottom-navbar" aria-level="Main Navigation">
        <a href="/" class="nav-item home-btn"><img src="stock/home.png" alt="Home">
            <span>Home</span></a>
        <a href="/" class="nav-item wishlist-btn"><img src="stock/heart.png" alt="Wishlist">
            <span>Wishlist</span></a>
        <a href="/" class="nav-item search-btn"><img src="stock/search_icon.png" alt="Search">
            <span>Search</span></a>
        <a href="/" class="nav-item cart-btn"><img src="stock/shopping-bag.png" alt="Cart">
            <span>Cart</span></a>
        <a href="/" class="nav-item profile-btn"><img src="stock/user.png" alt="Profile">
            <span>Profile</span></a>
    </nav>
</body>
</html>
